# Development-only MongoDB, bound to the local machine. Initiate the replica set before starting BuildLedger.
services:
  mongodb:
    image: mongo:7.0
    container_name: buildledger-mongo-dev
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - buildledger-mongo-data:/data/db
    restart: unless-stopped
volumes:
  buildledger-mongo-data:
